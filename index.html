<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Sudoku</h1>

    <!-- The 81 squares are added here by sudoku.js -->
    <div id="board"></div>

    <!-- Buttons for typing numbers with a mouse or finger -->
    <div id="numbers"></div>

    <div id="controls">
      <button id="new-game">New game</button>
    </div>

    <p id="message"></p>
  </main>

  <script src="sudoku.js"></script>
</body>
</html>
